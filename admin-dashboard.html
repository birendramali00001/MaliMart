
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaliMart Admin Dashboard</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#222}
header{background:#172554;color:white;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header h2{margin:0;font-size:21px}
button,select,input{font:inherit}
button{border:0;border-radius:6px;padding:10px 13px;cursor:pointer;background:#1d4ed8;color:white}
button:disabled{opacity:.5;cursor:not-allowed}
.logout{background:#dc2626}
.layout{display:flex;min-height:calc(100vh - 60px)}
nav{width:190px;background:#fff;padding:12px;flex-shrink:0;border-right:1px solid #ddd}
nav button{display:block;width:100%;margin:5px 0;text-align:left;background:#fff;color:#222}
nav button.active,nav button:hover{background:#dbeafe;color:#1d4ed8}
main{padding:18px;min-width:0;flex:1}
h2,h3{margin-top:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.card{background:white;padding:18px;border-radius:10px;box-shadow:0 1px 4px #0001}
.card small{color:#666}
.card strong{display:block;font-size:26px;margin-top:8px}
.panel{background:white;border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px #0001}
.message{padding:12px;border-radius:6px;margin-bottom:14px;display:none;overflow-wrap:anywhere}
.error{background:#fee2e2;color:#991b1b}
.success{background:#dcfce7;color:#166534}
.info{background:#dbeafe;color:#1e40af}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:700px}
th,td{padding:11px 9px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}
th{background:#f8fafc;white-space:nowrap}
td{overflow-wrap:anywhere}
td button{margin:2px;padding:7px 9px;font-size:12px}
input,select{padding:9px;border:1px solid #cbd5e1;border-radius:6px;max-width:100%}
.muted{color:#64748b;font-size:12px}
.status{display:inline-block;padding:4px 7px;border-radius:5px;background:#e5e7eb;font-size:12px}
.order-detail{min-width:180px;line-height:1.6}
.product-img{width:55px;height:55px;object-fit:cover;border-radius:6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.hidden{display:none!important}
#loading{padding:30px;text-align:center}
@media(max-width:650px){
 .layout{display:block}
 nav{width:100%;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid #ddd}
 nav button{min-width:max-content;width:auto;margin:3px}
 main{padding:12px}
 header h2{font-size:18px}
}
</style>
</head>

<body>
<header>
  <h2>🛍️ MaliMart Admin</h2>
  <div>
    <span id="adminEmail" style="font-size:12px;margin-right:8px"></span>
    <button class="logout" id="logoutBtn" onclick="logout()">Logout</button>
  </div>
</header>

<div id="loading">Checking your login...</div>

<div id="app" class="layout hidden">
  <nav>
    <button class="active" data-page="dashboard" onclick="openPage('dashboard',this)">Dashboard</button>
    <button data-page="products" onclick="openPage('products',this)">Products</button>
    <button data-page="orders" onclick="openPage('orders',this)">Orders</button>
    <button data-page="sellers" onclick="openPage('sellers',this)">Sellers</button>
    <button data-page="replacements" onclick="openPage('replacements',this)">Replacements</button>
    <button data-page="categories" onclick="openPage('categories',this)">Categories</button>
  </nav>

  <main>
    <div id="message" class="message"></div>
    <div id="pageContent"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';

const SUPABASE_URL = 'https://adlovngoubhcdlinhcoz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_HQLt_TlXvk3rR3h8ckIHTA_wWAej6Dp';

let db;
let currentPage = 'dashboard';
let cachedProducts = [];
let cachedOrders = [];

function showMessage(message, type='error') {
  const el = document.getElementById('message');
  el.className = 'message ' + type;
  el.textContent = message;
  el.style.display = 'block';
  window.scrollTo({top:0,behavior:'smooth'});
}

function clearMessage() {
  const el = document.getElementById('message');
  el.style.display = 'none';
  el.textContent = '';
}

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[ch]);
}

function money(value) {
  const n = Number(value);
  return 'Rs. ' + (Number.isFinite(n) ? n.toLocaleString('en-IN') : '0');
}

function displayDate(value) {
  if (!value) return '—';
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? escapeHTML(value) : d.toLocaleString();
}

function showLoading(text='Loading...') {
  document.getElementById('pageContent').innerHTML =
    '<div id="loading">' + escapeHTML(text) + '</div>';
}

async function withTimeout(promise, ms=12000) {
  let timer;
  try {
    return await Promise.race([
      promise,
      new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error(
          'The request timed out. Check your internet connection and reload the page.'
        )), ms);
      })
    ]);
  } finally {
    clearTimeout(timer);
  }
}

/* Start up: check the session only once. */
async function startApp() {
  const loading = document.getElementById('loading');

  try {
    if (!window.supabase || !window.supabase.createClient) {
      throw new Error('Supabase could not load. Check your internet connection and reload.');
    }

    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });

    const result = await withTimeout(db.auth.getSession());

    if (result.error) throw result.error;

    const session = result.data?.session;

    if (!session) {
      loading.textContent = 'No active login found. Opening the admin login page...';
      window.location.replace('admin.html');
      return;
    }

    document.getElementById('adminEmail').textContent =
      session.user?.email || 'Admin';

    loading.classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');

    await openPage('dashboard');

  } catch (err) {
    loading.classList.remove('hidden');
    loading.innerHTML =
      '<p>Could not open the admin dashboard.</p>' +
      '<p>' + escapeHTML(err.message || String(err)) + '</p>' +
      '<button onclick="location.reload()">Try Again</button>' +
      '<button onclick="location.href=\'admin.html\'">Open Login</button>';
  }
}

async function logout() {
  if (!db) {
    window.location.replace('admin.html');
    return;
  }

  const btn = document.getElementById('logoutBtn');
  btn.disabled = true;

  try {
    const {error} = await withTimeout(db.auth.signOut());
    if (error) throw error;
    window.location.replace('admin.html');
  } catch (err) {
    btn.disabled = false;
    showMessage('Logout failed: ' + err.message);
  }
}

async function openPage(page, button) {
  currentPage = page;
  clearMessage();

  document.querySelectorAll('nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.page === page);
  });

  if (button) {
    button.classList.add('active');
  }

  if (page === 'dashboard') return loadDashboard();
  if (page === 'products') return loadProducts();
  if (page === 'orders') return loadOrders();
  if (page === 'sellers') return loadSellers();
  if (page === 'replacements') return loadReplacements();
  if (page === 'categories') return loadCategories();
}

/* Dashboard */
async function loadDashboard() {
  showLoading('Loading dashboard...');

  try {
    const results = await Promise.all([
      db.from('products').select('*', {count:'exact',head:true}),
      db.from('orders').select('*', {count:'exact',head:true}),
      db.from('profiles').select('*', {count:'exact',head:true})
    ]);

    const productCount = results[0].count;
    const orderCount = results[1].count;
    const sellerCount = results[2].count;

    document.getElementById('pageContent').innerHTML = `
      <h2>Dashboard</h2>
      <div class="cards">
        <div class="card"><small>Total Products</small><strong>${productCount ?? '—'}</strong></div>
        <div class="card"><small>Total Orders</small><strong>${orderCount ?? '—'}</strong></div>
        <div class="card"><small>Profiles</small><strong>${sellerCount ?? '—'}</strong></div>
      </div>
      <div class="panel">
        <h3>Welcome to MaliMart</h3>
        <p>Use the menu to manage products, customer orders, sellers, replacements and categories.</p>
        <button onclick="openPage('orders')">View Orders</button>
        <button onclick="openPage('products')">Manage Products</button>
      </div>`;

    const errors = results.filter(r => r.error).map(r => r.error.message);
    if (errors.length) showMessage('Some dashboard counts could not load: ' + errors.join(' | '));
  } catch (err) {
    document.getElementById('pageContent').innerHTML = '<h2>Dashboard</h2>';
    showMessage(err.message || String(err));
  }
}

/* Products */
async function loadProducts() {
  showLoading('Loading products...');

  try {
    const {data, error} = await withTimeout(
      db.from('products').select('*').order('created_at', {ascending:false})
    );

    if (error) throw error;

    cachedProducts = data || [];

    if (!cachedProducts.length) {
      document.getElementById('pageContent').innerHTML =
        '<h2>Products</h2><div class="panel">No products found.</div>';
      return;
    }

    const rows = cachedProducts.map(p => {
      const id = p.id;
      const title = p.name || p.title || p.product_name || 'Unnamed product';
      const photo = p.image_url || p.image || p.photo_url || '';
      const status = p.status || '—';
      const price = p.price ?? p.selling_price ?? 0;

      return `<tr>
        <td>${photo ? `<img class="product-img" src="${escapeHTML(photo)}" alt="Product" onerror="this.style.display='none'">` : '—'}</td>
        <td><strong>${escapeHTML(title)}</strong><br><small class="muted">ID: ${escapeHTML(id)}</small></td>
        <td>${money(price)}</td>
        <td>${escapeHTML(p.category_id || p.category || '—')}</td>
        <td><span class="status">${escapeHTML(status)}</span></td>
        <td>
          <button onclick="changeProductStatus('${escapeHTML(id)}','approve')">Approve</button>
          <button style="background:#dc2626" onclick="changeProductStatus('${escapeHTML(id)}','reject')">Reject</button>
        </td>
      </tr>`;
    }).join('');

    document.getElementById('pageContent').innerHTML = `
      <h2>Products</h2>
      <div class="panel">
        <div class="toolbar">
          <button onclick="loadProducts()">Refresh Products</button>
        </div>
        <p class="muted">Approve products to make them available to customers. If your database uses different status values, the exact database error will appear here.</p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Photo</th><th>Product</th><th>Price</th><th>Category</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
  } catch (err) {
    document.getElementById('pageContent').innerHTML = '<h2>Products</h2>';
    showMessage('Could not load products: ' + err.message);
  }
}

async function changeProductStatus(id, action) {
  const product = cachedProducts.find(p => String(p.id) === String(id));
  if (!product) {
    showMessage('Product not found. Refresh the list.');
    return;
  }

  const candidates = action === 'approve'
    ? ['Active', 'active', 'Approved', 'approved']
    : ['Rejected', 'rejected'];

  let lastError = null;

  for (const status of candidates) {
    const {error} = await db.from('products')
      .update({status})
      .eq('id', id);

    if (!error) {
      showMessage(
        action === 'approve' ? 'Product approval saved.' : 'Product rejection saved.',
        'success'
      );
      await loadProducts();
      return;
    }

    lastError = error;

    /* Only try the next spelling if this is an enum/value problem. */
    const msg = String(error.message || '').toLowerCase();
    if (!msg.includes('enum') &&
        !msg.includes('invalid input value') &&
        !msg.includes('invalid value')) {
      break;
    }
  }

  showMessage('Could not update product status: ' +
    (lastError?.message || 'Unknown error') +
    '. The database status values or update permission may need checking.');
}

/* Orders */
function formatOrderItems(value) {
  if (!value) return 'No item details saved';

  let items = value;

  if (typeof items === 'string') {
    try { items = JSON.parse(items); }
    catch { return escapeHTML(items); }
  }

  if (!Array.isArray(items)) {
    return escapeHTML(JSON.stringify(items));
  }

  if (!items.length) return 'No items listed';

  return items.map(item => {
    if (typeof item === 'string') return escapeHTML(item);

    const name = item.name || item.title || item.product_name ||
      item.product || 'Product';
    const qty = item.quantity ?? item.qty ?? item.count ?? 1;
    const price = item.price ?? item.unit_price;

    return `<div>• ${escapeHTML(name)} × ${escapeHTML(qty)}` +
      (price != null ? ` — ${money(price)}` : '') + '</div>';
  }).join('');
}

async function loadOrders() {
  showLoading('Loading customer orders...');

  try {
    const {data, error} = await withTimeout(
      db.from('orders').select('*').order('created_at', {ascending:false})
    );

    if (error) throw error;

    cachedOrders = data || [];

    if (!cachedOrders.length) {
      document.getElementById('pageContent').innerHTML =
        '<h2>Orders</h2><div class="panel">No orders found.</div>';
      return;
    }

    const rows = cachedOrders.map(o => {
      const customerName = o.customer_name || o.name || '—';
      const phone = o.customer_phone || o.phone || '—';
      const address = o.delivery_address || o.address || '—';
      const area = o.delivery_area || '—';
      const status = o.status || 'pending';
      const id = o.id;

      return `<tr>
        <td class="order-detail">
          <strong>${escapeHTML(String(id).slice(0,12))}</strong><br>
          <small class="muted">${escapeHTML(displayDate(o.created_at))}</small>
        </td>
        <td class="order-detail">
          <strong>${escapeHTML(customerName)}</strong><br>
          Phone: ${escapeHTML(phone)}<br>
          Address: ${escapeHTML(address)}<br>
          Area: ${escapeHTML(area)}
        </td>
        <td class="order-detail">
          ${formatOrderItems(o.items)}
        </td>
        <td>
          <strong>${money(o.total)}</strong><br>
          Delivery: ${money(o.delivery_fee)}<br>
          Payment: ${escapeHTML(o.payment_method || '—')}<br>
          Payment status: ${escapeHTML(o.payment_status || '—')}
        </td>
        <td>
          <span class="status">${escapeHTML(status)}</span><br><br>
          <select id="order-status-${escapeHTML(id)}">
            ${['pending','confirmed','processing','shipped','delivered','completed','cancelled']
              .map(s => `<option value="${s}" ${String(status).toLowerCase()===s?'selected':''}>${s}</option>`)
              .join('')}
          </select>
          <button onclick="updateOrderStatus('${escapeHTML(id)}')">Save Status</button>
        </td>
      </tr>`;
    }).join('');

    document.getElementById('pageContent').innerHTML = `
      <h2>Customer Orders</h2>
      <div class="panel">
        <div class="toolbar">
          <button onclick="loadOrders()">Refresh Orders</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Order</th><th>Customer Details</th><th>Products Ordered</th><th>Payment & Total</th><th>Status Management</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
  } catch (err) {
    document.getElementById('pageContent').innerHTML = '<h2>Customer Orders</h2>';
    showMessage('Could not load orders: ' + err.message);
  }
}

/* FIXED: verify the database actually returned the updated order. */
async function updateOrderStatus(id) {
  const select = document.getElementById('order-status-' + id);

  if (!select) {
    showMessage('Order status selector not found. Refresh Orders and try again.');
    return;
  }

  const newStatus = select.value;
  select.disabled = true;

  try {
    const { data, error } = await withTimeout(
      db.from('orders')
        .update({ status: newStatus })
        .eq('id', id)
        .select('id, status')
        .maybeSingle()
    );

    if (error) {
      showMessage('Status update failed: ' + error.message);
      return;
    }

    if (!data) {
      showMessage(
        'No order was updated. Supabase permissions (RLS) or the order ID may be the problem.'
      );
      return;
    }

    if (String(data.status).toLowerCase() !== String(newStatus).toLowerCase()) {
      showMessage(
        'The database returned a different status (' + data.status + '). Refresh Orders and try again.'
      );
      return;
    }

    showMessage('Verified: order status saved as ' + data.status + '.', 'success');
    await loadOrders();

  } catch (err) {
    showMessage('Status update failed: ' + (err.message || String(err)));
  } finally {
    select.disabled = false;
  }
}

/* Sellers */
async function loadSellers() {
  showLoading('Loading seller profiles...');

  try {
    const {data, error} = await withTimeout(
      db.from('profiles').select('*').order('created_at', {ascending:false})
    );

    if (error) throw error;

    const sellers = (data || []).filter(p =>
      String(p.role || '').toLowerCase() === 'seller'
    );

    const rows = sellers.map(s => `<tr>
      <td>${escapeHTML(s.full_name || s.name || s.username || '—')}</td>
      <td>${escapeHTML(s.email || '—')}</td>
      <td>${escapeHTML(s.phone || s.phone_number || '—')}</td>
      <td>${escapeHTML(s.role || '—')}</td>
      <td><small>${escapeHTML(s.id || '—')}</small></td>
    </tr>`).join('');

    document.getElementById('pageContent').innerHTML = `
      <h2>Sellers</h2>
      <div class="panel">
        <button onclick="loadSellers()">Refresh Sellers</button>
        <div class="table-wrap" style="margin-top:12px">
          <table>
            <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>User ID</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="5">No seller profiles found.</td></tr>'}</tbody>
          </table>
        </div>
      </div>`;
  } catch (err) {
    document.getElementById('pageContent').innerHTML = '<h2>Sellers</h2>';
    showMessage('Could not load sellers: ' + err.message);
  }
}

/* Replacements */
async function loadReplacements() {
  showLoading('Loading replacement requests...');

  try {
    const {data, error} = await withTimeout(
      db.from('replacements').select('*').order('created_at', {ascending:false})
    );

    if (error) throw error;

    const rows = (data || []).map(r => `<tr>
      <td>${escapeHTML(r.id || '—')}</td>
      <td>${escapeHTML(r.order_id || '—')}</td>
      <td>${escapeHTML(r.customer_name || r.customer_id || '—')}</td>
      <td>${escapeHTML(r.reason || r.description || '—')}</td>
      <td>${escapeHTML(r.status || '—')}</td>
      <td>${escapeHTML(displayDate(r.created_at))}</td>
    </tr>`).join('');

    document.getElementById('pageContent').innerHTML = `
      <h2>Replacement Requests</h2>
      <div class="panel">
        <button onclick="loadReplacements()">Refresh</button>
        <div class="table-wrap" style="margin-top:12px">
          <table>
            <thead><tr><th>Request ID</th><th>Order ID</th><th>Customer</th><th>Reason</th><th>Status</th><th>Date</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="6">No replacement requests found.</td></tr>'}</tbody>
          </table>
        </div>
      </div>`;
  } catch (err) {
    document.getElementById('pageContent').innerHTML = '<h2>Replacement Requests</h2>';
    showMessage('Could not load replacements. Check whether the replacements table exists: ' + err.message);
  }
}

/* Categories */
async function loadCategories() {
  showLoading('Loading categories...');

  try {
    const {data, error} = await withTimeout(
      db.from('categories').select('*').order('name', {ascending:true})
    );

    if (error) throw error;

    const rows = (data || []).map(c => `<tr>
      <td>${escapeHTML(c.name || c.title || '—')}</td>
      <td>${escapeHTML(c.id || '—')}</td>
    </tr>`).join('');

    document.getElementById('pageContent').innerHTML = `
      <h2>Categories</h2>
      <div class="panel">
        <button onclick="loadCategories()">Refresh Categories</button>
        <div class="table-wrap" style="margin-top:12px">
          <table>
            <thead><tr><th>Category Name</th><th>Category ID</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="2">No categories found.</td></tr>'}</tbody>
          </table>
        </div>
      </div>`;
  } catch (err) {
    document.getElementById('pageContent').innerHTML = '<h2>Categories</h2>';
    showMessage('Could not load categories: ' + err.message);
  }
}

startApp();
</script>
</body>
</html>
