
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaliMart Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#202938}
header{background:#123c2d;color:white;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h2{margin:0;font-size:22px}
button,select,input{cursor:pointer;border:0;border-radius:7px;padding:10px 12px;font-size:14px}
button:disabled{opacity:.55;cursor:wait}
.logout{background:white;color:#123c2d}
.layout{display:flex;min-height:calc(100vh - 60px)}
nav{width:190px;flex-shrink:0;background:white;padding:12px;border-right:1px solid #ddd}
nav button{width:100%;text-align:left;margin:4px 0;background:white;color:#263b32}
nav button.active,nav button:hover{background:#dcefe5;font-weight:bold}
main{padding:20px;min-width:0;flex:1}
h1{font-size:24px;margin-top:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin-bottom:20px}
.card,.panel{background:white;border-radius:10px;padding:16px;box-shadow:0 1px 5px #0000000d}
.card strong{display:block;font-size:24px;margin-top:8px;overflow-wrap:anywhere}
.panel{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #e6e8eb;vertical-align:top;font-size:14px}
th{background:#f8faf9;white-space:nowrap}
.approve{background:#137547;color:white;margin:2px}
.reject{background:#b42318;color:white;margin:2px}
.refresh{background:#e2e8f0;color:#202938}
.photo{width:55px;height:55px;object-fit:cover;border-radius:6px;background:#eee}
.status{font-weight:bold}
.notice{padding:12px;margin:10px 0;border-radius:7px;overflow-wrap:anywhere}
.error{background:#fee4e2;color:#912018}
.success{background:#dcfae6;color:#05603a}
.muted{color:#667085}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{border:1px solid #d0d5dd;background:white;min-width:150px}
.order-products{min-width:180px}
.order-products div{padding:7px 0;border-bottom:1px solid #eee}
.order-products div:last-child{border-bottom:0}
.order-id{overflow-wrap:anywhere;max-width:180px}
.address-cell{min-width:180px;max-width:280px;overflow-wrap:anywhere}
@media(max-width:650px){
.layout{display:block}
nav{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-right:0;border-bottom:1px solid #ddd}
main{padding:13px}
h1{font-size:21px}
}
</style>
</head>
<body>
<header>
  <h2>MaliMart Admin</h2>
  <button class="logout" id="logoutBtn">Log out</button>
</header>

<div class="layout">
<nav>
  <button class="active" data-page="dashboard">🏠 Dashboard</button>
  <button data-page="products">📦 Products</button>
  <button data-page="orders">🧾 Orders</button>
  <button data-page="sellers">👥 Sellers</button>
  <button data-page="replacements">🔄 Replacements</button>
  <button data-page="categories">🏷️ Categories</button>
</nav>

<main>
  <h1 id="pageTitle">Dashboard</h1>
  <div id="message" aria-live="polite"></div>
  <div id="summary" class="cards"></div>
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <strong id="sectionTitle">Overview</strong>
      <button class="refresh" id="refreshBtn">Refresh</button>
    </div>
    <div id="content">Checking your login...</div>
  </div>
</main>
</div>

<script>
(() => {
  'use strict';

  const SUPABASE_URL = 'https://adlovngoubhcdlinhcoz.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_HQLt_TlXvk3rR3h8ckIHTA_wWAej6Dp';

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = id => document.getElementById(id);

  let currentPage = 'dashboard';
  let busyProductIds = new Set();
  let productSearch = '';
  let productFilter = 'all';

  function escapeHTML(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    })[char]);
  }

  function showMessage(message, type = 'error') {
    $('message').innerHTML =
      `<div class="notice ${type}">${escapeHTML(message)}</div>`;
  }

  function clearMessage() {
    $('message').innerHTML = '';
  }

  function money(value) {
    const number = Number(value);
    return 'Rs. ' + (
      Number.isFinite(number)
        ? number.toLocaleString('en-IN')
        : '0'
    );
  }

  function dateText(value) {
    if (!value) return '—';
    const date = new Date(value);
    return Number.isNaN(date.getTime())
      ? String(value)
      : date.toLocaleString();
  }

  function cell(value) {
    if (value === null || value === undefined || value === '') {
      value = '—';
    }
    if (typeof value === 'object') {
      value = JSON.stringify(value);
    }
    return `<td>${escapeHTML(value)}</td>`;
  }

  function normalizedStatus(value) {
    return String(value ?? '').trim().toLowerCase();
  }

  function isApprovedStatus(value) {
    return ['active', 'approved'].includes(normalizedStatus(value));
  }

  async function checkLogin() {
    try {
      const { data, error } = await db.auth.getSession();
      if (error) throw error;

      if (!data.session) {
        location.replace('admin.html');
        return false;
      }
      return true;
    } catch (error) {
      showMessage('Could not verify your login: ' + error.message);
      return false;
    }
  }

  async function getRows(table) {
    const { data, error } = await db.from(table).select('*');
    if (error) throw new Error(table + ': ' + error.message);
    return data || [];
  }

  function setActivePage(page) {
    currentPage = page;

    document.querySelectorAll('nav button').forEach(button => {
      button.classList.toggle('active', button.dataset.page === page);
    });

    const titles = {
      dashboard: 'Dashboard',
      products: 'Product Management',
      orders: 'Order Management',
      sellers: 'Seller Records',
      replacements: 'Replacement Requests',
      categories: 'Categories'
    };

    $('pageTitle').textContent = titles[page] || 'MaliMart Admin';
    clearMessage();
  }

  async function loadDashboard() {
    $('summary').innerHTML = '';
    $('sectionTitle').textContent = 'Store overview';
    $('content').innerHTML = 'Loading dashboard...';

    const results = await Promise.allSettled([
      getRows('products'),
      getRows('orders'),
      getRows('profile'),
      getRows('replacement')
    ]);

    const labels = ['products', 'orders', 'profile', 'replacement'];
    const rows = {};
    const errors = [];

    results.forEach((result, index) => {
      if (result.status === 'fulfilled') {
        rows[labels[index]] = result.value;
      } else {
        rows[labels[index]] = [];
        errors.push(result.reason?.message || String(result.reason));
      }
    });

    const products = rows.products;
    const orders = rows.orders;
    const sellers = rows.profile;
    const replacements = rows.replacement;

    const pending = products.filter(
      p => normalizedStatus(p.status) === 'pending'
    ).length;

    const approved = products.filter(
      p => isApprovedStatus(p.status)
    ).length;

    $('summary').innerHTML = [
      ['Products', products.length],
      ['Pending approval', pending],
      ['Approved / Active', approved],
      ['Orders', orders.length],
      ['Seller records', sellers.length],
      ['Replacement records', replacements.length]
    ].map(([label, value]) =>
      `<div class="card">${escapeHTML(label)}<strong>${value}</strong></div>`
    ).join('');

    $('content').innerHTML = `
      <p>Welcome to your MaliMart admin panel.</p>
      <p>Review pending products before they are made available to customers.</p>
      <button class="approve" data-goto="products">Review Products</button>
      <button class="refresh" data-goto="orders">View Orders</button>
    `;

    if (errors.length) {
      showMessage(
        'Some dashboard sections could not load: ' + errors.join(' | ')
      );
    }
  }

  function productTable(products) {
    if (!products.length) {
      return '<p>No products match this filter.</p>';
    }

    return `<table>
      <thead><tr>
        <th>Photo</th><th>Product</th><th>Category</th>
        <th>Price</th><th>Size</th><th>Stock</th>
        <th>Status</th><th>Actions</th>
      </tr></thead>
      <tbody>
      ${products.map(p => {
        const id = p.id;
        const status = String(p.status ?? 'Unknown');
        const lowerStatus = normalizedStatus(status);
        const busy = busyProductIds.has(String(id));
        const price = p.price ?? p.base_price ?? 0;
        const stock = p.stock_available ?? p.stock ?? '—';
        const category = p.category ?? p.category_name ?? p.category_id ?? '—';
        const image = p.image_url ?? p.image ?? '';

        const photo = image
          ? `<img class="photo" src="${escapeHTML(image)}"
              alt="Product photo" loading="lazy"
              onerror="this.style.display='none'">`
          : 'No photo';

        return `<tr>
          <td>${photo}</td>
          <td><strong>${escapeHTML(p.name ?? p.title ?? 'Unnamed product')}</strong><br>
            <small>${escapeHTML(id)}</small></td>
          ${cell(category)}
          ${cell(money(price))}
          ${cell(p.size)}
          ${cell(stock)}
          <td class="status">${escapeHTML(status)}</td>
          <td>
            <button class="approve" data-action="approve"
              data-id="${escapeHTML(id)}" ${busy ? 'disabled' : ''}>
              ${busy ? 'Saving…' : (isApprovedStatus(status) ? 'Set Active' : 'Approve')}
            </button>
            <button class="reject" data-action="reject"
              data-id="${escapeHTML(id)}" ${busy ? 'disabled' : ''}>Reject</button>
          </td>
        </tr>`;
      }).join('')}
      </tbody></table>`;
  }

  async function loadProducts() {
    $('summary').innerHTML = '';
    $('sectionTitle').textContent = 'Review and manage products';
    $('content').innerHTML = 'Loading products...';

    try {
      const products = await getRows('products');

      const pending = products.filter(
        p => normalizedStatus(p.status) === 'pending'
      ).length;

      const approved = products.filter(
        p => isApprovedStatus(p.status)
      ).length;

      const rejected = products.filter(
        p => normalizedStatus(p.status) === 'rejected'
      ).length;

      $('summary').innerHTML = [
        ['All products', products.length],
        ['Pending', pending],
        ['Approved / Active', approved],
        ['Rejected', rejected]
      ].map(([label, value]) =>
        `<div class="card">${escapeHTML(label)}<strong>${value}</strong></div>`
      ).join('');

      $('content').innerHTML = `
        <div class="toolbar">
          <input id="productSearch" type="search"
            placeholder="Search product name or ID"
            value="${escapeHTML(productSearch)}">
          <select id="productFilter">
            <option value="all" ${productFilter === 'all' ? 'selected' : ''}>All statuses</option>
            <option value="pending" ${productFilter === 'pending' ? 'selected' : ''}>Pending</option>
            <option value="approved" ${productFilter === 'approved' ? 'selected' : ''}>Approved / Active</option>
            <option value="rejected" ${productFilter === 'rejected' ? 'selected' : ''}>Rejected</option>
          </select>
        </div>
        <div id="productTableWrap"></div>
      `;

      renderFilteredProducts(products);

      $('productSearch').addEventListener('input', event => {
        productSearch = event.target.value;
        renderFilteredProducts(products);
      });

      $('productFilter').addEventListener('change', event => {
        productFilter = event.target.value;
        renderFilteredProducts(products);
      });

    } catch (error) {
      $('content').innerHTML = '<p>Products could not be loaded.</p>';
      showMessage(error.message);
    }
  }

  function renderFilteredProducts(products) {
    const query = productSearch.trim().toLowerCase();

    const filtered = products.filter(p => {
      const status = normalizedStatus(p.status);
      const name = String(p.name ?? p.title ?? '').toLowerCase();
      const id = String(p.id ?? '').toLowerCase();

      const matchesSearch =
        !query || name.includes(query) || id.includes(query);

      let matchesStatus = true;

      if (productFilter === 'pending') matchesStatus = status === 'pending';
      if (productFilter === 'approved') matchesStatus = isApprovedStatus(status);
      if (productFilter === 'rejected') matchesStatus = status === 'rejected';

      return matchesSearch && matchesStatus;
    });

    const wrap = $('productTableWrap');
    if (wrap) wrap.innerHTML = productTable(filtered);
  }

  function isEnumValueError(error) {
    const message = String(error?.message ?? error ?? '').toLowerCase();
    return message.includes('invalid input value for enum') ||
      (message.includes('enum') && message.includes('invalid input'));
  }

  async function tryStatusUpdate(id, candidate) {
    const { data, error } = await db
      .from('products')
      .update({ status: candidate })
      .eq('id', id)
      .select('id,status');

    if (error) throw error;

    if (!data || data.length === 0) {
      const noRow = new Error(
        'Supabase returned no updated row. Check admin UPDATE permission and the product ID.'
      );
      noRow.code = 'NO_ROW_UPDATED';
      throw noRow;
    }

    return data[0];
  }

  async function changeProductStatus(id, action) {
    const approve = action === 'approve';

    const confirmed = confirm(
      approve
        ? 'Approve this product and make it active if the database allows it?'
        : 'Reject this product?'
    );

    if (!confirmed) return;

    const key = String(id);
    if (busyProductIds.has(key)) return;

    busyProductIds.add(key);
    clearMessage();

    try {
      const candidates = approve
        ? ['Active', 'Approved', 'active', 'approved']
        : ['Rejected', 'rejected'];

      let savedRow = null;
      let lastEnumError = null;

      for (const candidate of candidates) {
        try {
          savedRow = await tryStatusUpdate(id, candidate);
          break;
        } catch (error) {
          if (isEnumValueError(error)) {
            lastEnumError = error;
            continue;
          }
          throw error;
        }
      }

      if (!savedRow) {
        throw new Error(
          'Supabase rejected the attempted status values. ' +
          (lastEnumError?.message || 'No accepted status was found.')
        );
      }

      showMessage(
        `Product status successfully saved as "${savedRow.status}".`,
        'success'
      );

      await loadProducts();

    } catch (error) {
      let message = error?.message || String(error);

      if (error?.code === 'NO_ROW_UPDATED') {
        message += ' This may be an admin UPDATE policy or row-access problem.';
      } else if (
        /permission|row-level security|\brls\b/i.test(message)
      ) {
        message += ' Supabase is blocking this update. Check the admin UPDATE policy.';
      }

      showMessage('Product status was NOT confirmed as saved: ' + message);
    } finally {
      busyProductIds.delete(key);
      if (currentPage === 'products') await loadProducts();
    }
  }

  // Format products stored in the orders.items JSON field.
  function orderItemsHTML(value) {
    let items = value;

    if (typeof items === 'string') {
      try {
        items = JSON.parse(items);
      } catch (_) {
        items = [];
      }
    }

    if (items && !Array.isArray(items) && Array.isArray(items.items)) {
      items = items.items;
    }

    if (!Array.isArray(items) || items.length === 0) {
      return '<span class="muted">No product details saved</span>';
    }

    return `<div class="order-products">${items.map(item => {
      if (!item || typeof item !== 'object') {
        return `<div>${escapeHTML(item ?? 'Product')}</div>`;
      }

      const product = item.product && typeof item.product === 'object'
        ? item.product
        : item;

      const name =
        product.name ||
        product.product_name ||
        product.title ||
        item.name ||
        item.product_name ||
        item.title ||
        'Product';

      const quantity = Number(item.quantity ?? item.qty ?? 1);
      const price = Number(
        item.price ?? item.unit_price ?? product.price ?? 0
      );

      const size = item.size || product.size || '';
      const lineTotal = item.subtotal ?? item.line_total;

      return `<div>
        <strong>${escapeHTML(name)}</strong><br>
        <small>Quantity: ${Number.isFinite(quantity) ? quantity : 1}</small>
        ${size ? `<br><small>Size: ${escapeHTML(size)}</small>` : ''}
        <br><small>${escapeHTML(money(price))} each</small>
        ${lineTotal !== undefined
          ? `<br><small>Item total: ${escapeHTML(money(lineTotal))}</small>`
          : ''}
      </div>`;
    }).join('')}</div>`;
  }

  async function loadOrders() {
    $('summary').innerHTML = '';
    $('sectionTitle').textContent = 'Customer orders';
    $('content').innerHTML = 'Loading orders...';

    try {
      const orders = await getRows('orders');

      const pendingOrders = orders.filter(
        o => normalizedStatus(o.status) === 'pending'
      ).length;

      const pendingPayments = orders.filter(
        o => normalizedStatus(o.payment_status) === 'pending'
      ).length;

      $('summary').innerHTML = [
        ['Total orders', orders.length],
        ['Pending orders', pendingOrders],
        ['Pending payments', pendingPayments]
      ].map(([label, value]) =>
        `<div class="card">${escapeHTML(label)}<strong>${value}</strong></div>`
      ).join('');

      if (!orders.length) {
        $('content').innerHTML = '<p>No orders found yet.</p>';
        return;
      }

      orders.sort((a, b) =>
        new Date(b.created_at || 0) - new Date(a.created_at || 0)
      );

      $('content').innerHTML = `
        <p class="muted">
          Customer details, purchased products, delivery information and payment details.
        </p>

        <table>
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer name and phone</th>
              <th>Delivery address</th>
              <th>Products ordered</th>
              <th>Delivery area</th>
              <th>Delivery fee</th>
              <th>Order total</th>
              <th>Payment method</th>
              <th>Payment status</th>
              <th>Order status</th>
              <th>Order date</th>
              <th>Delivered date</th>
            </tr>
          </thead>
          <tbody>
            ${orders.map(o => {
              const rawId = String(o.id ?? '—');
              const displayId = /^\d+$/.test(rawId)
                ? 'MM-' + rawId.padStart(5, '0')
                : rawId;

              const area = o.delivery_area === 'inside'
                ? 'Inside Biratnagar'
                : o.delivery_area === 'outside'
                  ? 'Outside Biratnagar'
                  : o.delivery_area || '—';

              const customerName =
                o.customer_name || o.full_name || o.name || '';

              const phone =
                o.customer_phone || o.phone || o.phone_number || '';

              const address =
                o.delivery_address || o.address || '';

              const paymentMethod = String(
                o.payment_method || '—'
              ).replaceAll('_', ' ');

              return `<tr>
                <td class="order-id">
                  <strong>$
